<!doctype html>
<html lang="cs" data-font="barlow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202123" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ponk for Bauhaus">
<title>ponk for Bauhaus – ceny z bauhaus.cz</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/app.css">
<script>
  // Vzhled a písmo nastavíme dřív, než se stránka vykreslí (žádné probliknutí).
  try {
    const t = localStorage.getItem("ponk.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    const f = localStorage.getItem("ponk.font");
    if (f) document.documentElement.dataset.font = f;
  } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/" aria-label="ponk for Bauhaus – domů">
      <img class="bauhaus" src="/bauhaus-logo.svg" alt="BAUHAUS" width="140" height="27">
      <span>ponk <small>for Bauhaus</small></span>
    </a>
    <form class="search" role="search" id="search-form" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="search" name="q" placeholder="Hledat v nabídce Bauhausu" enterkeyhint="search" aria-label="Hledat">
      <button type="button" class="clear" id="q-clear" aria-label="Smazat hledání" hidden>×</button>
      <div class="suggest" id="suggest" hidden></div>
    </form>
    <nav class="desk-nav" aria-label="Hlavní menu"></nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Hlavní menu"></nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
