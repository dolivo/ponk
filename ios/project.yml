# Projekt se generuje nástrojem XcodeGen (GitHub Actions to dělá automaticky):
#   brew install xcodegen && xcodegen generate
name: Ponk
options:
  bundleIdPrefix: cz.ponk
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ponk:
    type: application
    platform: iOS
    sources:
      - path: Ponk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.ponk.app
        PRODUCT_NAME: Ponk
        INFOPLIST_FILE: Ponk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Ponk:
    build:
      targets:
        Ponk: all
